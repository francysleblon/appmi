<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050710">
<title>Inglês do Seu Jeito</title>
<style>
  :root{
    --blue:#0047AB;
    --red:#E30613;
    --lime:#CFFF00;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:#050710;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* Fundo Mesh Apple */
  .background{
    position:fixed;
    inset:0;
    z-index:-3;
    overflow:hidden;
  }
  .mesh{
    position:absolute;
    inset:-20%;
    background:
      radial-gradient(60% 50% at 15% 20%, rgba(0,71,171,0.85) 0%, transparent 60%),
      radial-gradient(50% 45% at 85% 15%, rgba(227,6,19,0.8) 0%, transparent 55%),
      radial-gradient(55% 50% at 20% 85%, rgba(207,255,0,0.55) 0%, transparent 60%),
      radial-gradient(40% 40% at 85% 80%, rgba(0,71,171,0.6) 0%, transparent 55%),
      linear-gradient(180deg, #0b1022 0%, #050710 100%);
    filter:saturate(1.15) brightness(1.05);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.7;
    mix-blend-mode:screen;
    will-change:transform;
  }
  .blob1{width:65vmax;height:65vmax;left:-18%;top:-22%;background:var(--blue);animation:b1 28s ease-in-out infinite}
  .blob2{width:55vmax;height:55vmax;right:-20%;top:5%;background:var(--red);animation:b2 32s ease-in-out infinite}
  .blob3{width:50vmax;height:50vmax;left:5%;bottom:-28%;background:var(--lime);animation:b3 26s ease-in-out infinite;opacity:0.55}
  .blob4{width:40vmax;height:40vmax;right:15%;bottom:-18%;background:#7aa2ff;animation:b4 30s ease-in-out infinite;opacity:0.45}
  @keyframes b1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,8%) scale(1.08)}66%{transform:translate(-3%,4%) scale(0.96)}}
  @keyframes b2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-6%,4%) scale(1.06)}66%{transform:translate(4%,-3%) scale(0.98)}}
  @keyframes b3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,-6%) scale(1.1)}}
  @keyframes b4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,7%) scale(0.94)}}

  .grain{
    position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  main{
    flex:1;width:100%;max-width:900px;margin:0 auto;
    padding: max(28px, env(safe-area-inset-top)) 20px 24px;
    display:flex;flex-direction:column;align-items:center;
  }

  .logo-wrap{
    position:relative;margin-top:2vh;
    width:min(260px,58vw);aspect-ratio:1;
    display:grid;place-items:center;
  }
  .logo-glow{
    position:absolute;inset:-18%;
    background:
      radial-gradient(circle at 35% 30%, rgba(0,71,171,0.95) 0%, transparent 45%),
      radial-gradient(circle at 65% 70%, rgba(227,6,19,0.9) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(207,255,0,0.5) 0%, transparent 60%);
    filter:blur(60px);
    animation:pulse 4s ease-in-out infinite;
    opacity:.9;
  }
  @keyframes pulse{0%,100%{transform:scale(.96);opacity:.85}50%{transform:scale(1.04);opacity:1}}
  .logo{
    width:86%;height:auto;object-fit:contain;position:relative;z-index:2;
    filter: drop-shadow(0 24px 40px rgba(0,0,0,.38)) drop-shadow(0 4px 12px rgba(0,0,0,.3));
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  h1{
    margin-top:8px;text-align:center;
    font-size:clamp(17px,4.2vw,22px);
    font-weight:600;letter-spacing:-0.02em;
    color:rgba(255,255,255,.92);
    text-shadow:0 2px 24px rgba(0,0,0,.35);
  }

  .grid{
    margin-top:clamp(34px,6.5vh,56px);
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
  }
  @media(min-width:720px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
  }

  .btn{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:30px 18px;min-height:152px;border-radius:24px;text-decoration:none;color:#fff;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    box-shadow:
      0 10px 30px rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -1px 0 rgba(0,0,0,.08);
    transform:translateZ(0);
    transition:all .3s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
    opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .btn::after{
    content:"";position:absolute;inset:0;border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%);
    opacity:.7;pointer-events:none;
  }
  .btn::before{
    content:"";position:absolute;inset:-1px;border-radius:24px;
    background:radial-gradient(240px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.18),transparent 40%);
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .btn:hover{transform:translateY(-2px) scale(.99);background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.42);box-shadow:0 16px 44px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
  .btn:hover::before{opacity:1}
  .btn:active{transform:scale(.97) translateY(0)}
  @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .btn:nth-child(1){animation-delay:.05s}
  .btn:nth-child(2){animation-delay:.1s}
  .btn:nth-child(3){animation-delay:.15s}
  .btn:nth-child(4){animation-delay:.2s}
  .btn:nth-child(5){animation-delay:.25s}
  .btn:nth-child(6){animation-delay:.3s}

  .btn-icon{
    width:62px;height:62px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.10));
    border:1px solid rgba(255,255,255,.4);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.65),0 8px 18px rgba(0,0,0,.18);
    font-size:30px;line-height:1;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .btn-text{
    font-size:17px;font-weight:600;letter-spacing:-.01em;
    text-shadow:0 1px 2px rgba(0,0,0,.22);
  }

  footer{
    width:100%;text-align:center;
    padding:44px 20px calc(28px + env(safe-area-inset-bottom));
    font-size:13px;font-weight:500;letter-spacing:.01em;
    color:rgba(255,255,255,.7);
  }

  @media(max-width:360px){
    .grid{gap:12px}
    .btn{min-height:136px;padding:24px 14px;border-radius:22px}
    .btn-icon{width:54px;height:54px;border-radius:16px;font-size:26px}
    .btn-text{font-size:15.5px}
  }
</style>
</head>
